name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swan
          POSTGRES_PASSWORD: swan
          POSTGRES_DB: swan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swan"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://swan:swan@localhost:5432/swan
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
